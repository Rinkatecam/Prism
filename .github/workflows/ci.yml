name: CI

on:
  push:
  pull_request:

jobs:
  # Runs FIRST and gates nothing else, deliberately: this repository is public
  # and has leaked real hostnames twice, both times past a manual review. Local
  # hooks are the fast feedback; this is the layer that still works when someone
  # clones without running install_hooks.py, or pushes with --no-verify.
  #
  # Two tiers:
  #   * shape rules — always, no secrets needed.
  #   * config-derived terms — only if the ANONYMISATION_DENYLIST secret is set.
  #     Shape rules cannot know the AD domain or a personal account; only a list
  #     of real values can, and that list must never be committed.
  #
  # --redact masks matched values, because a failure here writes to a PUBLIC
  # build log and GitHub only masks a secret's exact full value, not the
  # individual lines within it.
  anonymisation:
    name: Anonymisation (no real hostnames)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit messages and history, not just the tip

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Materialise the deny-list, if one is configured
        env:
          DENYLIST: ${{ secrets.ANONYMISATION_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > .anonymisation-denylist
            echo "deny-list configured: $(grep -vc '^\s*\(#.*\)\?$' .anonymisation-denylist) term(s)"
          else
            echo "::warning title=Shape rules only::ANONYMISATION_DENYLIST is not set, so CI cannot check for the real domain or account names. Add it in Settings -> Secrets -> Actions."
          fi

      - name: Scan the working tree
        run: python tools/check_anonymised.py --redact

      - name: Scan every commit and commit message
        run: python tools/check_anonymised.py --redact --range "$(git rev-list --max-parents=0 HEAD | tail -1)"

      - name: Confirm the hooks are wired up
        run: |
          test -x .githooks/pre-push || { echo "::error::.githooks/pre-push missing or not executable"; exit 1; }
          test -x .githooks/pre-commit || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }

  test:
    name: Test (hash-pinned install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.13-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.13-

      - name: Install runtime dependencies (hash-verified)
        # --require-hashes refuses to install any package whose wheel/sdist hash
        # is not listed in requirements.lock. This is the production install
        # path; CI failure here means lock drift and must be fixed before merge.
        # Note: pywin32 is sys_platform=='win32' only and is silently skipped on Linux runners.
        run: pip install --require-hashes -r requirements.lock

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Smoke import
        run: python -c "import app; print('OK')"

      - name: Run pytest
        run: pytest

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    # Don't fail the build on findings yet — Sprint-3 hardens this to fail-on-Critical.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.13-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.13-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.lock
        # Print findings; do not fail. Hardening to "fail on Critical" is Sprint-3.
        run: pip-audit -r requirements.lock --disable-pip || true
