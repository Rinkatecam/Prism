name: CI

on:
  push:
  pull_request:

jobs:
  # Runs FIRST and gates nothing else, deliberately: this repository is public
  # and has leaked real hostnames twice, both times past a manual review. Local
  # hooks are the fast feedback; this is the layer that still works when someone
  # clones without running install_hooks.py, or pushes with --no-verify.
  #
  # Two tiers:
  #   * shape rules — always, no secrets needed.
  #   * config-derived terms — only if the ANONYMISATION_DENYLIST secret is set.
  #     Shape rules cannot know the AD domain or a personal account; only a list
  #     of real values can, and that list must never be committed.
  #
  # --redact masks matched values, because a failure here writes to a PUBLIC
  # build log and GitHub only masks a secret's exact full value, not the
  # individual lines within it.
  anonymisation:
    name: Anonymisation (no real hostnames)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit messages and history, not just the tip

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Materialise the deny-list, if one is configured
        env:
          DENYLIST: ${{ secrets.ANONYMISATION_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > .anonymisation-denylist
            echo "deny-list configured: $(grep -vc '^\s*\(#.*\)\?$' .anonymisation-denylist) term(s)"
          else
            echo "::warning title=Shape rules only::ANONYMISATION_DENYLIST is not set, so CI cannot check for the real domain or account names. Add it in Settings -> Secrets -> Actions."
          fi

      - name: Scan the working tree
        run: python tools/check_anonymised.py --redact

      # HEAD, not the root commit: `git rev-list <root>` walks the ANCESTORS of
      # the root, which is only the root itself. That scanned 1 commit of 4 and
      # reported success.
      - name: Scan every commit and commit message
        run: python tools/check_anonymised.py --redact --range HEAD

      - name: Confirm the hooks are wired up
        run: |
          test -x .githooks/pre-push || { echo "::error::.githooks/pre-push missing or not executable"; exit 1; }
          test -x .githooks/pre-commit || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }

  test:
    name: Test (hash-pinned install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.13-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.13-

      - name: Install runtime dependencies (hash-verified)
        # --require-hashes refuses to install any package whose wheel/sdist hash
        # is not listed in requirements.lock. This is the production install
        # path; CI failure here means lock drift and must be fixed before merge.
        # Note: pywin32 is sys_platform=='win32' only and is silently skipped on Linux runners.
        run: pip install --require-hashes -r requirements.lock

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Smoke import
        run: python -c "import app; print('OK')"

      - name: Run pytest
        run: pytest

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    # Was continue-on-error: true, "Sprint-3 hardens this to fail-on-Critical."
    # "Sprint-3" is a dangling reference — no such sprint plan exists anywhere
    # in this repo's current docs/plans/ (checked 2026-09-23, see
    # docs/plans/CICD_REVIEW.md). More importantly, "fail-on-Critical" turns
    # out not to be buildable as literally stated: pip-audit 2.10.1's own
    # OSV-sourced records for these findings carry NO severity/CVSS field at
    # all (confirmed by inspecting its full JSON output), and the CLI has no
    # --fail-on-severity flag — only --ignore-vuln ID (repeatable). There is
    # no "Critical" to gate on without standing up separate severity-scoring
    # tooling, which is its own project, not a one-line hardening.
    #
    # What ships instead: fail on any REGRESSION. Every finding known as of
    # 2026-09-23 (25 IDs across cryptography, idna, pillow, pyasn1, urllib3 —
    # see docs/plans/CICD_REVIEW.md for the full table and remediation notes)
    # is explicitly grandfathered below so today's baseline stays green; any
    # NEW finding pip-audit turns up from here on fails the job for real.
    # This does NOT silently bless the grandfathered list forever — each ID
    # here is a real, currently-unpatched finding (several in `cryptography`,
    # which backs this project's own credential encryption) that still wants
    # a deliberate upgrade decision from the owner. Re-run pip-audit locally
    # and prune this list whenever a grandfathered package is upgraded past
    # its fix version, and re-baseline (with the owner's eyes on the new
    # list) if a wider dependency bump happens first.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.13-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.13-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.lock (fails on any NEW finding)
        # Baseline as of 2026-09-23 — see the job-level comment above and
        # docs/plans/CICD_REVIEW.md for what each ID is and why it's here.
        run: |
          pip-audit -r requirements.lock --disable-pip \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-1284 \
            --ignore-vuln PYSEC-2026-2141 \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln PYSEC-2026-215 \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3452 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-142
