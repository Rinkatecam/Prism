{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center py-20">
  <div class="text-6xl font-bold text-muted mb-2">500</div>
  <p class="text-lg text-muted mb-6">{{ t.something_went_wrong }}</p>
  <p class="text-sm text-muted mb-6">{{ t.error_unexpected }}</p>
  <a href="/" class="px-4 py-2 rounded bg-accent text-white dark:text-page hover:opacity-90 text-sm font-medium flex items-center gap-2">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    {{ t.back_to_dashboard }}
  </a>
</div>
{% endblock %}
