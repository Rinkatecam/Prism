{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-[#1E293B] rounded-lg border border-[#E5E7EB] dark:border-[#334155] p-6 shadow-sm">

      <!-- Logo -->
      <div class="text-center mb-6">
        <div class="flex items-center justify-center gap-2 text-[#2563EB] dark:text-[#3B82F6] font-bold text-xl mb-1">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="" class="w-8 h-8" width="32" height="32">
          <span class="prism-wordmark">Prism</span>
        </div>
        <p class="text-sm text-[#6B7280] dark:text-[#CBD5E1]">{{ t.sign_in_to_continue }}</p>
      </div>

      <!-- Error message -->
      {% if error %}
      <div class="mb-4 rounded-lg p-3 text-sm bg-[#FEE2E2] dark:bg-[#7F1D1D] text-[#991B1B] dark:text-[#FCA5A5]">
        {{ error }}
      </div>
      {% endif %}

      <!-- Login form -->
      <form method="POST" action="/login" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
          <label for="username" class="block text-xs font-medium mb-1">{{ t.username }}</label>
          <input type="text" id="username" name="username" required autofocus
                 placeholder="DOMAIN\username or username"
                 class="w-full px-3 py-2 text-sm rounded border border-[#E5E7EB] dark:border-[#334155] bg-white dark:bg-[#0F172A] focus:ring-2 focus:ring-[#8B5CF6] dark:focus:ring-[#A78BFA] focus:border-transparent outline-none">
        </div>

        <div>
          <label for="password" class="block text-xs font-medium mb-1">{{ t.password }}</label>
          <input type="password" id="password" name="password" required
                 placeholder="Enter your password"
                 class="w-full px-3 py-2 text-sm rounded border border-[#E5E7EB] dark:border-[#334155] bg-white dark:bg-[#0F172A] focus:ring-2 focus:ring-[#8B5CF6] dark:focus:ring-[#A78BFA] focus:border-transparent outline-none">
        </div>

        <div class="flex items-center">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="remember_me" class="w-4 h-4 rounded border-[#D1D5DB] dark:border-[#4B5563] text-[#8B5CF6] focus:ring-[#8B5CF6]">
            <span class="text-xs text-[#6B7280] dark:text-[#CBD5E1]">{{ t.remember_me }}</span>
          </label>
        </div>

        <button type="submit"
                class="btn-brand w-full px-4 py-2 text-sm font-medium rounded-lg">
          {{ t.sign_in }}
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-[#6B7280] dark:text-[#CBD5E1] mt-4">
      {{ t.ad_credentials_hint }}
    </p>
  </div>
</div>

{% endblock %}
