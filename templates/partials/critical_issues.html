<!-- Critical Issues Section -->
{% if issues | length == 0 %}
<div id="healthy-banner" class="bg-healthy-tint rounded-lg p-4 border border-healthy/20 flex items-center gap-3 transition-opacity duration-slow">
  <i data-lucide="check-circle" class="w-5 h-5 text-healthy flex-shrink-0"></i>
  <span class="text-sm font-medium text-healthy-strong">{{ t.all_healthy }}</span>
</div>
{# The auto-dismiss timer lives in base.html (_prismFadeHealthy, armed on
   htmx:afterSettle). No inline <script> here: this partial is HTMX-swapped and
   a fresh per-request nonce would not match the host page's CSP nonce. #}
{% else %}
<div>
  <h2 class="text-xl font-semibold flex items-center gap-2 mb-3">
    <i data-lucide="alert-octagon" class="w-5 h-5 text-critical"></i>
    {{ t.issues_detected }}
    <span class="badge badge-critical">{{ issues | length }}</span>
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
    {% for issue in issues %}
    <a href="/server/{{ issue.server_name }}"
       {# `card-clickable` replaces `hover:shadow-md transition-shadow`: the
          class carries the lift, the shadow AND the focus ring, and the
          Tailwind pair carried only the shadow. `transition-shadow` also
          quietly narrowed the transition to one property, so the lift the
          class adds would have snapped instead of moving — Tailwind's sheet
          is injected after app.css and wins at equal specificity. #}
       class="card-clickable block bg-card rounded-lg p-4 border border-line {% if issue.status == 'critical' %}border-status-critical{% elif issue.status == 'warning' %}border-status-warning{% else %}border-status-offline{% endif %}">
      <div class="flex items-center justify-between mb-2">
        <span class="font-semibold text-sm">{{ issue.server_name }}</span>
        <span class="badge badge-{{ issue.status }}">{{ issue.status }}</span>
      </div>

      {# Per-metric coloring uses PER-SERVER thresholds (passed in from the view).
         Red ≥ critical, amber ≥ warning, gray otherwise. Fallback defaults are
         only used if the server config has no thresholds set at all. #}
      {% set _t = issue.thresholds or {} %}
      {% set _cpu_w = _t.get('cpu_warning', 75) %}
      {% set _cpu_c = _t.get('cpu_critical', 90) %}
      {% set _ram_w = _t.get('ram_warning', 80) %}
      {% set _ram_c = _t.get('ram_critical', 90) %}
      {% set _dsk_w = _t.get('disk_warning', 80) %}
      {% set _dsk_c = _t.get('disk_critical', 90) %}
      <!-- Show the worst metrics -->
      <div class="space-y-1 text-xs">
        {% if issue.cpu_percent is not none and issue.cpu_percent >= 0 %}
          {% set cpu_class = 'text-critical font-semibold' if issue.cpu_percent >= _cpu_c else ('text-warning font-semibold' if issue.cpu_percent >= _cpu_w else 'text-muted') %}
          <div class="{{ cpu_class }}">CPU: {{ issue.cpu_percent | round(1) }}%</div>
        {% endif %}
        {% if issue.ram_percent is not none and issue.ram_percent >= 0 %}
          {% set ram_class = 'text-critical font-semibold' if issue.ram_percent >= _ram_c else ('text-warning font-semibold' if issue.ram_percent >= _ram_w else 'text-muted') %}
          <div class="{{ ram_class }}">RAM: {{ issue.ram_percent | round(1) }}%</div>
        {% endif %}
        {% if issue.disk_c_percent is not none and issue.disk_c_percent >= 0 %}
          {% set dc_class = 'text-critical font-semibold' if issue.disk_c_percent >= _dsk_c else ('text-warning font-semibold' if issue.disk_c_percent >= _dsk_w else 'text-muted') %}
          <div class="{{ dc_class }}">Disk C: {{ issue.disk_c_percent | round(1) }}%</div>
        {% endif %}
        {% if issue.disk_d_percent is not none and issue.disk_d_percent >= 0 %}
          {% set dd_class = 'text-critical font-semibold' if issue.disk_d_percent >= _dsk_c else ('text-warning font-semibold' if issue.disk_d_percent >= _dsk_w else 'text-muted') %}
          <div class="{{ dd_class }}">Disk D: {{ issue.disk_d_percent | round(1) }}%</div>
        {% endif %}
        {% if issue.status == 'offline' %}
          <div class="text-faint italic">{{ t.server_unreachable }}</div>
        {% endif %}
      </div>

      {# Why this host is listed. verdict_detail arrives via **m from the
         collector cache (collector_v2/aggregator.py), so it may be absent on a
         cold cache — every lookup degrades to drawing nothing. A deviation is
         rendered deliberately quieter than a breach: it means "unusual for this
         host" while still inside configured limits. See
         docs/plans/ALERT_NOISE_AND_VERDICT_UX_PLAN.md §4. #}
      {% set _vd = issue.verdict_detail or {} %}
      {% set _pick = ((_vd | dictsort | selectattr('1.kind', 'equalto', 'floor') | list)
                      or (_vd | dictsort | selectattr('1.kind', 'equalto', 'breach') | list)
                      or (_vd | dictsort | selectattr('1.kind', 'equalto', 'deviation') | list)) | first %}
      {% if _pick %}
      {% set _pk = _pick[1].get('kind') %}
      <div class="mt-2 pt-2 border-t border-line flex items-start gap-1.5 text-[11px] leading-snug {% if _pk == 'deviation' %}text-muted dark:text-muted {% elif _pk == 'floor' or issue.status == 'critical' %}text-critical {% else %}text-[#B45309] dark:text-warning{% endif %}">
        <i data-lucide="{% if _pk == 'deviation' %}activity{% elif _pk == 'floor' %}alert-octagon{% else %}alert-triangle{% endif %}"
           class="w-3 h-3 flex-shrink-0 mt-0.5" aria-hidden="true"></i>
        <span class="line-clamp-2">{{ _pick[1].get('reason', '') }}</span>
      </div>
      {% endif %}

      <div class="text-[10px] text-faint mt-2">
        {{ t.click_details }}
      </div>
    </a>
    {% endfor %}
  </div>
</div>
{% endif %}
